name: Build Android APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dev Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup local.properties
        run: |
          touch local.properties
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties

      - name: Apply DetailScreen patch
        run: python3 .github/scripts/patch_detail_screen.py

      - name: Apply MainActivity patch
        run: python3 .github/scripts/patch_main_activity.py

      - name: Apply Sonium Branding patch
        run: python3 .github/scripts/patch_branding.py

      - name: Apply Sonium v0.2.0 patch
        run: python3 .github/scripts/patch_v020.py

      - name: Apply Sonium v0.3.0 patch
        run: python3 .github/scripts/patch_v030.py

      - name: Apply AI Lyrics AppSettings patch
        run: python3 .github/scripts/patch_ai_lyrics.py

      - name: Apply Sonium v0.4.0 patch
        run: python3 .github/scripts/patch_v040.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Debug APK
        run: ./gradlew assembleDevDebug -x test --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonium-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
