name: Build Android APK
on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sonium APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup local.properties
        run: |
          touch local.properties
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties

      - name: Setup fixed debug keystore
        run: python3 .github/scripts/setup_fixed_keystore.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Debug APK
        run: ./gradlew assembleDevDebug -x test --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonium-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
