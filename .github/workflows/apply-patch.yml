name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c 'import io
          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()
          marker = "val exportDataTitle = stringResource(R.string.export_data)"
          idx = t.find(marker)
          assert idx != -1, "Marker not found"
          gs = t.rfind("SearchableSettingsGroup", 0, idx)
          assert gs != -1, "SearchableSettingsGroup not found"
          ls = t.rfind("\n", 0, gs) + 1
          indent = t[ls:gs]
          bs = t.find("{", gs)
          assert bs != -1 and bs < idx, "Opening brace not found"
          count = 1
          ep = -1
          for i in range(bs + 1, len(t)):
              if t[i] == "{":
                  count += 1
              elif t[i] == "}":
                  count -= 1
                  if count == 0:
                      ep = i + 1
                      break
          assert ep != -1, "Closing brace not found"
          old = t[ls:ep]
          print("OLD:\n" + old)
          nl = "\n"
          nb = indent + "SearchableSettingsGroup(search, header = \"Backup & Restauração\") {" + nl + indent + "    val exportDataTitle = stringResource(R.string.export_data)" + nl + indent + "    row(exportDataTitle, \"backup\") {" + nl + indent + "        SettingsRow(" + nl + indent + "            icon = Icons.Rounded.FileUpload," + nl + indent + "            title = exportDataTitle," + nl + indent + "            subtitle = exportStatus ?: stringResource(R.string.export_data_subtitle)," + nl + indent + "            onClick = { exportPicker.launch(Backup.suggestedName()) }," + nl + indent + "        )" + nl + indent + "    }" + nl + indent + "    val importDataTitle = stringResource(R.string.import_data)" + nl + indent + "    row(importDataTitle, \"backup\", \"restore\") {" + nl + indent + "        SettingsRow(" + nl + indent + "            icon = Icons.Rounded.FileDownload," + nl + indent + "            title = importDataTitle," + nl + indent + "            subtitle = importStatus ?: stringResource(R.string.import_data_subtitle)," + nl + indent + "            onClick = { confirmImport = true }," + nl + indent + "        )" + nl + indent + "    }" + nl + indent + "}"
          print("NEW:\n" + nb)
          t2 = t[:ls] + nb + t[ep:]
          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t2)
          print("SUCCESS")
          '
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "feat(settings): clean up Storage and set Backup & Restauração header in SettingsSheet.kt" && git push)
