name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version in app/build.gradle.kts
        run: |
          python3 -c '
          path = "app/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()
          assert "versionCode = 35" in c, "versionCode 35 not found"
          assert "versionName = \"0.5.2\"" in c, "versionName 0.5.2 not found"
          c = c.replace("versionCode = 35", "versionCode = 36", 1)
          c = c.replace("versionName = \"0.5.2\"", "versionName = \"0.5.3\"", 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          print("version bumped to 0.5.3 (36)")
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to 0.5.3 (build 36)"
          git push
