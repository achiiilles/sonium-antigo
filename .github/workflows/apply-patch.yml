name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update values/strings.xml
        run: |
          cat > /tmp/add_strings.py <<'PYEOF'
          import io

          path = "app/src/main/res/values/strings.xml"
          c = io.open(path, encoding="utf-8").read()

          if 'name="portuguese_br"' not in c:
              block = """
    <!-- Idiomas -->
    <string name="portuguese_pt">Portuguese (Portugal)</string>
    <string name="portuguese_br">Portuguese (Brazil)</string>

    <!-- Áudio Espacial -->
    <string name="spatial_audio_bluetooth_only">Enable only with Bluetooth headphones</string>
    <string name="spatial_audio_bluetooth_only_subtitle">Turns on spatial audio automatically when wireless headphones connect and turns off when disconnected</string>

    <!-- Tradução de Letras por IA -->
    <string name="ai_lyrics_translation">AI lyrics translation</string>
    <string name="ai_lyrics_translation_subtitle">Translates and adapts while maintaining poetic rhythm and natural rhymes for the app language</string>
    <string name="ai_lyrics_api_key">Google AI Studio API key (Gemini)</string>
    <string name="ai_lyrics_api_key_hint">Paste your Google AI Studio API key</string>
    <string name="lyrics_offset_description">Positive values display lyrics later</string>
</resources>"""
              c = c.replace("</resources>", block)
              io.open(path, "w", encoding="utf-8").write(c)
              print("values/strings.xml updated successfully")
          else:
              print("strings already present")
          PYEOF
          python3 /tmp/add_strings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values/strings.xml
          git commit -m "feat: adicionar strings base em ingles para idiomas, audio espacial e IA"
          git push
