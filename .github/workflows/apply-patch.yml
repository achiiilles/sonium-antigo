name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Patch Script
        run: |
          cat << 'EOF' > patch.py
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. State & BackHandler
          target_search = "val closeSearch = {"
          replacement_search = "var showArtistLibrary by rememberSaveable(page.browseId) { mutableStateOf(false) }\n    BackHandler(enabled = showArtistLibrary) { showArtistLibrary = false }\n\n    val closeSearch = {"
          if target_search in content and "showArtistLibrary" not in content:
              content = content.replace(target_search, replacement_search, 1)

          # 2. Pill clickable & condition
          target_pill = ".clickable { /* abrir tela dedicada da biblioteca */ }"
          replacement_pill = ".clickable { showArtistLibrary = true }"
          if target_pill in content:
              content = content.replace(target_pill, replacement_pill, 1)

          target_cond = 'if (isArtist) {\n            item(key = "artist_library_pill") {'
          replacement_cond = 'if (isArtist && libraryArtistSongs.isNotEmpty()) {\n            item(key = "artist_library_pill") {'
          if target_cond in content:
              content = content.replace(target_cond, replacement_cond, 1)

          # 3. Overlay ArtistLibraryScreen when showArtistLibrary is true
          anim_prefix = "    AnimatedContent(\n        targetState = activeShelf,"
          box_prefix = "    Box(modifier = modifier.fillMaxSize()) {\n        AnimatedContent(\n            targetState = activeShelf,"
          if anim_prefix in content and "ArtistLibraryScreen(" not in content:
              content = content.replace(anim_prefix, box_prefix, 1)
              # Also change modifier in AnimatedContent to Modifier.fillMaxSize()
              content = content.replace('label = "artist_shelf_transition",\n        modifier = modifier.fillMaxSize(),', 'label = "artist_shelf_transition",\n            modifier = Modifier.fillMaxSize(),', 1)
              
              # Find end of AnimatedContent block by locating closing of activeShelf transition
              # Inside AnimatedContent: } else {\n            ArtistShelfDetail(
              # After ArtistShelfDetail: onArtistClick = onArtistClick,\n            )\n        }\n    }
              # We append the ArtistLibraryScreen overlay inside the Box:
              marker = "onArtistClick = onArtistClick,\n            )\n        }\n    }"
              overlay = (
                  "onArtistClick = onArtistClick,\n"
                  "            )\n"
                  "        }\n"
                  "    }\n\n"
                  "    if (showArtistLibrary) {\n"
                  "        ArtistLibraryScreen(\n"
                  "            artistName = page.title,\n"
                  "            songs = libraryArtistSongs,\n"
                  "            onBack = { showArtistLibrary = false },\n"
                  "            onSongClick = { songs, index -> onSongClick(songs, index) },\n"
                  "            onShuffle = onShuffle,\n"
                  "        )\n"
                  "    }\n"
                  "    }"
              )
              if marker in content:
                  content = content.replace(marker, overlay, 1)
              else:
                  # Alternative pattern if indent varies
                  import re
                  pattern = r"(onArtistClick\s*=\s*onArtistClick,\s*\)\s*\}\s*\})"
                  match = re.search(pattern, content)
                  if match:
                      overlay_alt = match.group(1) + "\n\n        if (showArtistLibrary) {\n            ArtistLibraryScreen(\n                artistName = page.title,\n                songs = libraryArtistSongs,\n                onBack = { showArtistLibrary = false },\n                onSongClick = { songs, index -> onSongClick(songs, index) },\n                onShuffle = onShuffle,\n            )\n        }\n    }"
                      content = content[:match.start()] + overlay_alt + content[match.end():]
                  else:
                      raise ValueError("Marker for end of AnimatedContent not found!")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("DetailScreen.kt patch successfully applied!")
          EOF
          python3 patch.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git commit -m "feat: ligar toque da pilula para abrir ArtistLibraryScreen no DetailScreen.kt"
          git push
