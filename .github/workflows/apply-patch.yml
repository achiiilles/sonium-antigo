name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply MiniPlayer patch
        run: |
          python3 -c '
          import re

          path = "app/src/main/java/com/music/bitchord/ui/components/MiniPlayer.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          if "import android.os.Build" not in c:
              assert "package com.music.bitchord.ui.components" in c, "package header not found"
              c = c.replace("package com.music.bitchord.ui.components\n", "package com.music.bitchord.ui.components\n\nimport android.os.Build\n", 1)

          pattern = re.compile(
              r"(?P<indent>[ \t]*)if\s*\(reduceDynamicBlur\)\s*\{\s*"
              r"Modifier\.background\(MaterialTheme\.colorScheme\.surface\)\s*"
              r"\}\s*else\s*\{\s*"
              r"Modifier\.optimizedHazeEffect\(\s*"
              r"state\s*=\s*hazeState,\s*"
              r"style\s*=\s*HazeMaterials\.thin\(MaterialTheme\.colorScheme\.surface\),?\s*"
              r"\)\s*"
              r"\},"
          )

          def repl(m):
              indent = m.group("indent")
              return (
                  f"{indent}if (reduceDynamicBlur) {{\n"
                  f"{indent}    Modifier.background(MaterialTheme.colorScheme.surface)\n"
                  f"{indent}}} else if (Build.VERSION.SDK_INT < 31) {{\n"
                  f"{indent}    Modifier.background(Color(0xF2161618))\n"
                  f"{indent}}} else {{\n"
                  f"{indent}    Modifier.optimizedHazeEffect(\n"
                  f"{indent}        state = hazeState,\n"
                  f"{indent}        style = HazeMaterials.thin(MaterialTheme.colorScheme.surface),\n"
                  f"{indent}    )\n"
                  f"{indent}}},"
              )

          c_new, n = pattern.subn(repl, c, count=1)
          assert n == 1, f"Expected 1 replacement, got {n}"
          assert "Color(0xF2161618)" in c_new, "Color(0xF2161618) missing"
          assert "import android.os.Build" in c_new, "import android.os.Build missing"

          with open(path, "w", encoding="utf-8") as f:
              f.write(c_new)
          print("MiniPlayer.kt patched successfully")
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/components/MiniPlayer.kt
          git commit -m "feat: usar vidro escuro estático no MiniPlayer para Android < 12"
          git push
