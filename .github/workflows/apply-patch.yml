name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          cat << 'EOF' > patch.py
import io
p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
with io.open(p, "r", encoding="utf-8") as f:
    t = f.read()
marker = "val exportDataTitle = stringResource(R.string.export_data)"
idx_export = t.find(marker)
assert idx_export != -1, f"Marker '{marker}' not found in {p}"
group_start = t.rfind("SearchableSettingsGroup", 0, idx_export)
assert group_start != -1, f"SearchableSettingsGroup before exportDataTitle not found in {p}"
line_start = t.rfind("\n", 0, group_start) + 1
indent = t[line_start:group_start]
brace_start = t.find("{", group_start)
assert brace_start != -1 and brace_start < idx_export, "Opening brace not found"
count = 1
end_pos = -1
for i in range(brace_start + 1, len(t)):
    if t[i] == '{':
        count += 1
    elif t[i] == '}':
        count -= 1
        if count == 0:
            end_pos = i + 1
            break
assert end_pos != -1, "Closing brace not found"
old_block = t[line_start:end_pos]
print("OLD BLOCK:\n" + old_block)
assert "exportDataTitle" in old_block
new_block = f"""{indent}SearchableSettingsGroup(search, header = "Backup & Restauração") {{
{indent}    val exportDataTitle = stringResource(R.string.export_data)
{indent}    row(exportDataTitle, "backup") {{
{indent}        SettingsRow(
{indent}            icon = Icons.Rounded.FileUpload,
{indent}            title = exportDataTitle,
{indent}            subtitle = exportStatus ?: stringResource(R.string.export_data_subtitle),
{indent}            onClick = {{ exportPicker.launch(Backup.suggestedName()) }},
{indent}        )
{indent}    }}
{indent}    val importDataTitle = stringResource(R.string.import_data)
{indent}    row(importDataTitle, "backup", "restore") {{
{indent}        SettingsRow(
{indent}            icon = Icons.Rounded.FileDownload,
{indent}            title = importDataTitle,
{indent}            subtitle = importStatus ?: stringResource(R.string.import_data_subtitle),
{indent}            onClick = {{ confirmImport = true }},
{indent}        )
{indent}    }}
{indent}}}"""
print("NEW BLOCK:\n" + new_block)
t_new = t[:line_start] + new_block + t[end_pos:]
with io.open(p, "w", encoding="utf-8") as f:
    f.write(t_new)
print("SUCCESS: Updated SettingsSheet.kt with Step 3")
EOF
          python3 patch.py
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "feat(settings): clean up Storage and set Backup & Restauração header in SettingsSheet.kt" && git push)
