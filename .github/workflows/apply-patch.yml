name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Patch Script
        run: |
          cat << 'EOF' > patch.py
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          imp_target = "import androidx.compose.material.icons.rounded.LibraryMusic\n"
          imp_replacement = ("import androidx.compose.material.icons.rounded.LibraryMusic\n"
                             "import androidx.compose.material.icons.automirrored.rounded.KeyboardArrowRight\n"
                             "import androidx.compose.material3.Surface\n"
                             "import androidx.compose.foundation.BorderStroke\n")

          if imp_target in content and imp_replacement not in content:
              content = content.replace(imp_target, imp_replacement, 1)

          marker = "// Albums / Singles & EPs carousels (artist pages)."
          if marker not in content:
              raise ValueError("Marker not found in DetailScreen.kt")

          pill_lines = [
              "            if (isArtist) {\n",
              "                item(key = \"artist_library_pill\") {\n",
              "                    Surface(\n",
              "                        modifier = Modifier\n",
              "                            .fillMaxWidth()\n",
              "                            .padding(horizontal = PAGE_GUTTER, vertical = 6.dp)\n",
              "                            .clickable { /* abrir tela dedicada da biblioteca */ },\n",
              "                        shape = CircleShape,\n",
              "                        color = palette.elevated,\n",
              "                        border = BorderStroke(0.5.dp, Color.White.copy(alpha = 0.12f)),\n",
              "                    ) {\n",
              "                        Row(\n",
              "                            modifier = Modifier.padding(horizontal = 16.dp, vertical = 10.dp),\n",
              "                            verticalAlignment = Alignment.CenterVertically,\n",
              "                        ) {\n",
              "                            Icon(\n",
              "                                imageVector = Icons.Rounded.LibraryMusic,\n",
              "                                contentDescription = null,\n",
              "                                tint = palette.onBackground,\n",
              "                                modifier = Modifier.size(18.dp),\n",
              "                            )\n",
              "                            Spacer(Modifier.width(8.dp))\n",
              "                            Text(\n",
              "                                text = \"Na sua biblioteca\",\n",
              "                                style = MaterialTheme.typography.labelLarge,\n",
              "                                color = palette.onBackground,\n",
              "                            )\n",
              "                            Spacer(Modifier.weight(1f))\n",
              "                            Icon(\n",
              "                                imageVector = Icons.AutoMirrored.Rounded.KeyboardArrowRight,\n",
              "                                contentDescription = null,\n",
              "                                tint = palette.onBackgroundVariant,\n",
              "                                modifier = Modifier.size(18.dp),\n",
              "                            )\n",
              "                        }\n",
              "                    }\n",
              "                }\n",
              "            }\n",
              "\n"
          ]
          pill_block = "".join(pill_lines)

          lines = content.splitlines(keepends=True)
          new_lines = []
          inserted = False
          for line in lines:
              if not inserted and marker in line:
                  new_lines.append(pill_block)
                  inserted = True
              new_lines.append(line)

          if not inserted:
              raise ValueError("Could not insert pill block before marker")

          content = "".join(new_lines)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Patch successfully applied!")
          EOF
          python3 patch.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git commit -m "feat: adicionar pilula Na sua biblioteca no DetailScreen.kt"
          git push
