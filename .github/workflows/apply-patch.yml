name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          old_card_pat = r'(\s*if\s*\(\s*isArtist\s*&&\s*libraryArtistSongs\.isNotEmpty\(\)\s*\)\s*\{\s*\n\s*item\(key\s*=\s*"artist-library-card"\)\s*\{[\s\S]*?\}\s*\n\s*\})'
          m1 = re.search(old_card_pat, code)
          if not m1:
              print("ERROR: old_card_pat not found")
              sys.exit(1)

          new_card = """            if (isArtist && (libraryArtistSongs.isNotEmpty() || libraryArtistAlbums.isNotEmpty())) {
                  item(key = "artist_library_card") {
                      Surface(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = PAGE_GUTTER, vertical = 6.dp)
                              .clickable { showArtistLibrary = true },
                          shape = CircleShape,
                          color = palette.elevated,
                          border = BorderStroke(0.5.dp, Color.White.copy(alpha = 0.12f)),
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 20.dp, vertical = 14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Icon(
                                  imageVector = Icons.Rounded.LibraryMusic,
                                  contentDescription = null,
                                  tint = palette.onBackground,
                                  modifier = Modifier.size(20.dp),
                              )
                              Spacer(Modifier.width(12.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = "Na sua biblioteca",
                                      style = MaterialTheme.typography.titleSmall,
                                      color = palette.onBackground,
                                  )
                                  val countText = buildString {
                                      if (libraryArtistSongs.isNotEmpty()) {
                                          append("${libraryArtistSongs.size} ${if (libraryArtistSongs.size == 1) "música" else "músicas"}")
                                      }
                                      if (libraryArtistAlbums.isNotEmpty()) {
                                          if (isNotEmpty()) append(" • ")
                                          append("${libraryArtistAlbums.size} ${if (libraryArtistAlbums.size == 1) "álbum" else "álbuns"}")
                                      }
                                  }
                                  if (countText.isNotEmpty()) {
                                      Text(
                                          text = countText,
                                          style = MaterialTheme.typography.bodySmall,
                                          color = palette.onBackgroundVariant,
                                      )
                                  }
                              }
                              Icon(
                                  imageVector = Icons.AutoMirrored.Rounded.KeyboardArrowRight,
                                  contentDescription = null,
                                  tint = palette.onBackgroundVariant,
                                  modifier = Modifier.size(20.dp),
                              )
                          }
                      }
                  }
              }"""

          code = code[:m1.start()] + "\n" + new_card + code[m1.end():]
          print("SUCCESS: Replaced old card with new library card")

          old_pill_pat = r'\s*if\s*\(\s*isArtist\s*\)\s*\{\s*\n\s*item\(key\s*=\s*"artist_library_pill"\)\s*\{[\s\S]*?\}\s*\n\s*\}\s*\n'
          m2 = re.search(old_pill_pat, code)
          if m2:
              code = code[:m2.start()] + "\n\n" + code[m2.end():]
              print("SUCCESS: Removed lower duplicate pill")
          else:
              print("WARNING: lower pill not found")

          func_pat = r'/\*\*\s*\n\s*\* Translucent Apple Music / iOS style card displaying[\s\S]*?private fun ArtistLibraryCard\([\s\S]*?\n\}\n'
          m3 = re.search(func_pat, code)
          if m3:
              code = code[:m3.start()] + "\n" + code[m3.end():]
              print("SUCCESS: Removed unused ArtistLibraryCard function")
          else:
              print("WARNING: ArtistLibraryCard function not found")

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt updated successfully")
          PYEOF

      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "feat: substituir card antigo pelo card Na sua biblioteca no topo e remover duplicidade em DetailScreen.kt" && git push)
