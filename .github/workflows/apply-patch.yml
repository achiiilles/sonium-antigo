name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SettingsSheet patch
        run: |
          python3 -c '
          import re
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          pattern = r"val hideSongStatusTitle = stringResource\(R\.string\.hide_song_status\)[\s\S]*?onClick = \{ AppSettings\.setHideSongStatus\(!hideSongStatus\) \},\s*\)\s*\}"
          assert re.search(pattern, c), "Pattern not found in SettingsSheet.kt"

          replacement = """row("Status da música", "player", "playing from", "indicador") {
                  SettingsRow(
                      icon = Icons.Rounded.Tune,
                      title = "Mostrar status da música",
                      subtitle = "Exibe o indicador e de onde a faixa está tocando no topo do player",
                      trailing = {
                          IosSwitch(
                              checked = !hideSongStatus,
                              onCheckedChange = { AppSettings.setHideSongStatus(!it) },
                              colors = SwitchDefaults.colors(
                                  checkedTrackColor = MaterialTheme.colorScheme.primary,
                                  checkedBorderColor = MaterialTheme.colorScheme.primary,
                              ),
                          )
                      },
                      onClick = { AppSettings.setHideSongStatus(hideSongStatus) },
                  )
              }"""

          c = re.sub(pattern, replacement, c, count=1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git commit -m "feat: atualizar switch para mostrar status da música nas configurações"
          git push
