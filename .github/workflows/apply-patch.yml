name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update subpage header in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target_str = "text = selectedCategory!!.title"
          if target_str not in code:
              print("ERROR: target_str not found in SettingsSheet.kt")
              sys.exit(1)

          t_idx = code.find(target_str)
          row_idx = code.rfind("Row(", 0, t_idx)
          if row_idx == -1:
              print("ERROR: row_idx not found before target_str")
              sys.exit(1)

          text_close_paren = code.find(")", t_idx)
          row_close_brace = code.find("}", text_close_paren)
          if row_close_brace == -1:
              print("ERROR: row_close_brace not found")
              sys.exit(1)

          new_block = """Text(
                  text = selectedCategory!!.title,
                  style = MaterialTheme.typography.displayLarge,
                  color = MaterialTheme.colorScheme.onBackground,
                  modifier = Modifier.padding(start = 20.dp, end = 20.dp, top = 8.dp, bottom = 14.dp),
              )"""

          code = code[:row_idx] + new_block + code[row_close_brace + 1:]
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: Subpage header updated to displayLarge in SettingsSheet.kt")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "style: atualizar cabecalho das subpastas para displayLarge em SettingsSheet.kt" && git push)
