name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply HomeScreen patch
        run: |
          python3 -c '
          path = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/HomeScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          c = c.replace("\r\n", "\n")

          target = """            else -> {
                Box(
                    modifier = Modifier
                        .fillMaxWidth()
                        .aspectRatio(1f)
                        .clip(RoundedCornerShape(12.dp))
                        .thumbnailBorder(RoundedCornerShape(12.dp))
                        .background(MaterialTheme.colorScheme.surfaceVariant),
                ) {"""

          replacement = """            else -> {
                val isArtist = (item.browseId?.startsWith("UC") == true) || item.subtitle.contains("inscritos", ignoreCase = true) || item.subtitle.contains("subscribers", ignoreCase = true) || item.subtitle.equals("Artist", ignoreCase = true) || item.subtitle.equals("Artista", ignoreCase = true)
                val cardShape = if (isArtist) CircleShape else RoundedCornerShape(12.dp)
                Box(
                    modifier = Modifier
                        .fillMaxWidth()
                        .aspectRatio(1f)
                        .clip(cardShape)
                        .thumbnailBorder(cardShape)
                        .background(MaterialTheme.colorScheme.surfaceVariant),
                ) {"""

          assert target in c, "target not found"
          c = c.replace(target, replacement, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/screens/HomeScreen.kt
          git commit -m "feat: definir fotos de artistas como redondas com CircleShape no ShelfCard"
          git push
