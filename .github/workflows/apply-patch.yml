name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ArtworkMeshBackdrop patch
        run: |
          python3 -c '
          path = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          assert "filterQuality = FilterQuality.Low" in c, "FilterQuality.Low not found in ArtworkMeshBackdrop.kt"
          c_new = c.replace("filterQuality = FilterQuality.Low", "filterQuality = FilterQuality.Medium")

          with open(path, "w", encoding="utf-8") as f:
              f.write(c_new)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt
          git commit -m "feat: usar FilterQuality.Medium no ArtworkMeshBackdrop para suavizar o desfoque do player"
          git push
