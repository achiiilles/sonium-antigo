name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 - << 'EOF'
          import io

          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          t = t.replace("\r\n", "\n")

          imports = [
              "import androidx.compose.animation.animateContentSize",
              "import androidx.compose.animation.core.Spring",
              "import androidx.compose.animation.core.animateDpAsState",
              "import androidx.compose.animation.core.spring",
              "import androidx.compose.foundation.shape.RoundedCornerShape",
          ]
          for imp in imports:
              if imp not in t:
                  t = t.replace("package com.music.bitchord.ui.screens\n", "package com.music.bitchord.ui.screens\n" + imp + "\n")

          old_target = "\n".join([
              "internal fun SettingsGroup(",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    /** Room above the card, where there is no [header] to provide it. */",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape = GroupShape,",
              "    content: @Composable () -> Unit,",
              ") {",
              "    if (header != null) {",
              "        Text(",
              "            text = header.uppercase(Locale.ROOT),",
              "            style = MaterialTheme.typography.labelSmall,",
              "            color = MaterialTheme.colorScheme.onSurfaceVariant,",
              "            modifier = Modifier.padding(",
              "                start = GROUP_INSET + 4.dp,",
              "                end = GROUP_INSET,",
              "                top = 26.dp,",
              "                bottom = 8.dp,",
              "            ),",
              "        )",
              "    } else {",
              "        Spacer(Modifier.height(topSpacing))",
              "    }",
              "    Column(",
              "        modifier = Modifier",
              "            .fillMaxWidth()",
              "            .padding(horizontal = GROUP_INSET)",
              "            .clip(shape)",
              "            .background(MaterialTheme.colorScheme.surfaceVariant)",
              "            .border(0.5.dp, Color.White.copy(alpha = 0.10f), shape),",
              "    ) {",
              "        content()",
              "    }",
              "    if (footer != null) {",
              "        Text(",
              "            text = footer,",
              "            style = MaterialTheme.typography.bodyMedium,",
              "            color = MaterialTheme.colorScheme.onSurfaceVariant,",
              "            modifier = Modifier.padding(",
              "                start = GROUP_INSET + 4.dp,",
              "                end = GROUP_INSET + 4.dp,",
              "                top = 8.dp,",
              "            ),",
              "        )",
              "    }",
              "}",
          ])

          new_target = "\n".join([
              "internal fun SettingsGroup(",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    /** Room above the card, where there is no [header] to provide it. */",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape = GroupShape,",
              "    content: @Composable () -> Unit,",
              ") {",
              "    val isCapsule = shape == CapsuleShape",
              "    val animatedCornerRadius by animateDpAsState(",
              "        targetValue = if (isCapsule) 28.dp else 14.dp,",
              "        animationSpec = spring(",
              "            dampingRatio = Spring.DampingRatioLowBouncy,",
              "            stiffness = Spring.StiffnessMedium,",
              "        ),",
              "        label = \"cardShapeAnimation\",",
              "    )",
              "    val currentShape = if (shape == CapsuleShape || shape == GroupShape) {",
              "        RoundedCornerShape(animatedCornerRadius)",
              "    } else {",
              "        shape",
              "    }",
              "",
              "    if (header != null) {",
              "        Text(",
              "            text = header.uppercase(Locale.ROOT),",
              "            style = MaterialTheme.typography.labelSmall,",
              "            color = MaterialTheme.colorScheme.onSurfaceVariant,",
              "            modifier = Modifier.padding(",
              "                start = GROUP_INSET + 4.dp,",
              "                end = GROUP_INSET,",
              "                top = 26.dp,",
              "                bottom = 8.dp,",
              "            ),",
              "        )",
              "    } else {",
              "        Spacer(Modifier.height(topSpacing))",
              "    }",
              "    Column(",
              "        modifier = Modifier",
              "            .fillMaxWidth()",
              "            .padding(horizontal = GROUP_INSET)",
              "            .animateContentSize(",
              "                animationSpec = spring(",
              "                    dampingRatio = Spring.DampingRatioNoBouncy,",
              "                    stiffness = Spring.StiffnessMedium,",
              "                ),",
              "            )",
              "            .clip(currentShape)",
              "            .background(MaterialTheme.colorScheme.surfaceVariant)",
              "            .border(0.5.dp, Color.White.copy(alpha = 0.10f), currentShape),",
              "    ) {",
              "        content()",
              "    }",
              "    if (footer != null) {",
              "        Text(",
              "            text = footer,",
              "            style = MaterialTheme.typography.bodyMedium,",
              "            color = MaterialTheme.colorScheme.onSurfaceVariant,",
              "            modifier = Modifier.padding(",
              "                start = GROUP_INSET + 4.dp,",
              "                end = GROUP_INSET + 4.dp,",
              "                top = 8.dp,",
              "            ),",
              "        )",
              "    }",
              "}",
          ])

          if old_target not in t:
              old_target_alt = old_target.replace("/** Room", "/* Room")
              if old_target_alt in t:
                  old_target = old_target_alt

          assert old_target in t, "old_target SettingsGroup not found"
          t = t.replace(old_target, new_target, 1)

          open_b = t.count('{')
          close_b = t.count('}')
          assert open_b == close_b, f"Unbalanced braces: {open_b} vs {close_b}"

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: SettingsSheet.kt patched cleanly with fluid animations")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "Adicionar animação fluida de formato e tamanho no SettingsGroup" && git push)
