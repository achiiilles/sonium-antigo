name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target = "                }\n            }\n\n            // Albums / Singles & EPs carousels (artist pages).\n            items(publicSections) { shelf ->"
          replacement = "            // Albums / Singles & EPs carousels (artist pages).\n            items(publicSections) { shelf ->"

          if target not in code:
              target = target.replace("\n", "\r\n")
              replacement = replacement.replace("\n", "\r\n")

          if target not in code:
              print("ERROR: target not found in DetailScreen.kt")
              sys.exit(1)

          code = code.replace(target, replacement, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt updated successfully")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "fix(ui): remove dangling closing braces in DetailScreen.kt" && git push)
