name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AppSettings patch
        run: |
          python3 -c '
          path = "app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          target1 = "val hideSongStatus = MutableStateFlow(false)"
          assert target1 in c, "target1 not found"
          c = c.replace(target1, "val hideSongStatus = MutableStateFlow(true)", 1)

          target2 = "hideSongStatus.value = prefs.getBoolean(KEY_HIDE_SONG_STATUS, false)"
          assert target2 in c, "target2 not found"
          c = c.replace(target2, "hideSongStatus.value = prefs.getBoolean(KEY_HIDE_SONG_STATUS, true)", 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          git commit -m "feat: definir status da música como oculto por padrão no AppSettings"
          git push
