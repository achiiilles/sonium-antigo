name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Pass albums to ArtistLibraryScreen in DetailScreen.kt
        run: |
          python3 -c '
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          target = """if (showArtistLibrary) {
ArtistLibraryScreen(
artistName = page.title,
songs = libraryArtistSongs,
onBack = { showArtistLibrary = false },
onSongClick = onSongClick,
onShuffle = onShuffle,
)"""

          replacement = """val libraryArtistAlbums = remember(page.sections) {
    page.sections.filter {
        it.title.contains("sua biblioteca", ignoreCase = true) ||
        it.title.contains("your library", ignoreCase = true)
    }.flatMap { it.items }
}

if (showArtistLibrary) {
ArtistLibraryScreen(
artistName = page.title,
songs = libraryArtistSongs,
albums = libraryArtistAlbums,
onBack = { showArtistLibrary = false },
onSongClick = onSongClick,
onShuffle = onShuffle,
onAlbumClick = onSectionItemClick,
)"""

          if target in content:
              content = content.replace(target, replacement, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("SUCCESS: DetailScreen updated")
          else:
              import re
              pat = r"if\s*\(\s*showArtistLibrary\s*\)\s*\{\s*ArtistLibraryScreen\s*\(\s*artistName\s*=\s*page\.title\s*,\s*songs\s*=\s*libraryArtistSongs\s*,\s*onBack\s*=\s*\{\s*showArtistLibrary\s*=\s*false\s*\}\s*,\s*onSongClick\s*=\s*onSongClick\s*,\s*onShuffle\s*=\s*onShuffle\s*,\s*\)"
              if re.search(pat, content):
                  content = re.sub(pat, replacement, content, count=1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("SUCCESS: DetailScreen updated via regex")
              else:
                  print("TARGET NOT FOUND")
                  exit(1)
          '
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || git commit -m "feat: passar álbuns da biblioteca para ArtistLibraryScreen em DetailScreen.kt"
          git push
