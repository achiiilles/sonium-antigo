name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c '
import io, sys
p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
with io.open(p, "r", encoding="utf-8") as f:
    t = f.read()

t_vol = "val hideVolumeBarTitle = stringResource(R.string.hide_volume_bar)"
i_vol = t.find(t_vol)
assert i_vol != -1, "hideVolumeBarTitle not found"
s_rem = t.rfind("\n", 0, i_vol) + 1

t_st = "AppSettings.setHideSongStatus(hideSongStatus)"
i_st = t.find(t_st, i_vol)
assert i_st != -1, "setHideSongStatus not found"
e_row = t.find("}", t.find(")", i_st))
e_rem = t.find("}", e_row + 1) + 1
while e_rem < len(t) and t[e_rem] in ("\r", "\n"):
    e_rem += 1

block = t[s_rem:e_rem]
if not block.endswith("\n"):
    block += "\n"

t = t[:s_rem] + t[e_rem:]

t_mesh = "AppSettings.setLegacyMeshGradient(!legacyMeshGradient)"
i_mesh = t.find(t_mesh)
assert i_mesh != -1, "legacyMeshGradient not found"
e_m_row = t.find("}", t.find(")", i_mesh))
e_m_block = t.find("}", e_m_row + 1) + 1
while e_m_block < len(t) and t[e_m_block] in ("\r", "\n"):
    e_m_block += 1

t = t[:e_m_block] + block + t[e_m_block:]

with io.open(p, "w", encoding="utf-8") as f:
    f.write(t)

print("SUCCESS: SettingsSheet.kt updated")
'
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor(settings): move volume bar and song status options to appearance category" && git push)
