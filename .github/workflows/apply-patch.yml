name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Remove duplicate back button in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import io, re, sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target = None
          replacement = """        Row(
              modifier = Modifier
                  .fillMaxWidth()
                  .padding(start = 20.dp, end = 20.dp, top = 8.dp, bottom = 12.dp),
              verticalAlignment = Alignment.CenterVertically,
          ) {
              Text(
                  text = selectedCategory!!.title,
                  style = MaterialTheme.typography.headlineMedium,
                  color = MaterialTheme.colorScheme.onBackground,
                  maxLines = 1,
                  overflow = TextOverflow.Ellipsis,
              )
          }"""

          old_block = """        Row(
              modifier = Modifier
                  .fillMaxWidth()
                  .padding(start = 8.dp, end = 20.dp, top = 8.dp, bottom = 12.dp),
              verticalAlignment = Alignment.CenterVertically,
          ) {
              IconButton(onClick = { selectedCategory = null }) {
                  Icon(
                      imageVector = Icons.AutoMirrored.Rounded.ArrowBack,
                      contentDescription = stringResource(R.string.back),
                      tint = MaterialTheme.colorScheme.onBackground,
                  )
              }
              Spacer(Modifier.width(4.dp))
              Text(
                  text = selectedCategory!!.title,
                  style = MaterialTheme.typography.headlineMedium,
                  color = MaterialTheme.colorScheme.onBackground,
                  maxLines = 1,
                  overflow = TextOverflow.Ellipsis,
              )
          }"""

          if old_block in code:
              code = code.replace(old_block, replacement, 1)
          elif old_block.replace('\n', '\r\n') in code:
              code = code.replace(old_block.replace('\n', '\r\n'), replacement.replace('\n', '\r\n'), 1)
          else:
              pattern = r'Row\(\s*modifier\s*=\s*Modifier\s*\.fillMaxWidth\(\)\s*\.padding\(\s*start\s*=\s*8\.dp,\s*end\s*=\s*20\.dp,\s*top\s*=\s*8\.dp,\s*bottom\s*=\s*12\.dp\s*\),\s*verticalAlignment\s*=\s*Alignment\.CenterVertically,\s*\)\s*\{\s*IconButton\s*\(\s*onClick\s*=\s*\{\s*selectedCategory\s*=\s*null\s*\}\s*\)\s*\{[\s\S]*?\}\s*Spacer\s*\([^)]*\)\s*Text\(\s*text\s*=\s*selectedCategory!!\.title,\s*style\s*=\s*MaterialTheme\.typography\.headlineMedium,\s*color\s*=\s*MaterialTheme\.colorScheme\.onBackground,\s*maxLines\s*=\s*1,\s*overflow\s*=\s*TextOverflow\.Ellipsis,\s*\)\s*\}'
              code, count = re.subn(pattern, replacement, code, count=1)
              if count != 1:
                  print("ERROR: could not find old Row with back button in SettingsSheet.kt")
                  sys.exit(1)

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: Back button removed from subpage in SettingsSheet.kt")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor: remover botao de voltar da subpasta em SettingsSheet.kt" && git push)
