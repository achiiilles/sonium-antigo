name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply NowPlayingScreen patch
        run: |
          python3 -c '
          import re
          path = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          pattern = r"(\s+Box\(\s+Modifier\s+\.align\(Alignment\.TopCenter\)[\s\S]*?\.background\(Color\.White\.copy\(alpha = 0\.70f\)\),\s+\))([\s\S]*?if \(!hideSongStatus\) \{)"
          match = re.search(pattern, c)
          assert match, "Pattern not found"
          box_code = match.group(1)
          if_block = match.group(2)

          new_block = if_block + "\n" + box_code
          c = c[:match.start()] + new_block + c[match.end():]
          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt
          git commit -m "feat: ocultar barra de arrastar junto com o status da música no player"
          git push
