name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update MainActivity.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "app/src/main/java/com/music/bitchord/MainActivity.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. State: tabHistory & LaunchedEffect
          old_tab = "    var selectedTab by rememberSaveable { mutableIntStateOf(0) }"
          new_tab = "    var selectedTab by rememberSaveable { mutableIntStateOf(0) }\n    var tabHistory by rememberSaveable { mutableStateOf(listOf(0)) }\n\n    LaunchedEffect(selectedTab) {\n        if (tabHistory.lastOrNull() != selectedTab) {\n            tabHistory = tabHistory + selectedTab\n        }\n    }"
          if old_tab not in code:
              print("ERROR: old_tab not found")
              sys.exit(1)
          code = code.replace(old_tab, new_tab, 1)

          # 2. BackHandler
          old_back = "        BackHandler(\n            enabled = detail == null && !showSettings && !showAccountScrobbling && !showSpotify &&\n                !showSources && !showListenTogether && !showEqualizer && !showReplay && selectedMoodGenre == null &&\n                selectedTab != TAB_HOME,\n        ) {\n            selectedTab = TAB_HOME\n        }"
          new_back = "        BackHandler(\n            enabled = detail == null && !showSettings && !showAccountScrobbling && !showSpotify &&\n                !showSources && !showListenTogether && !showEqualizer && !showReplay && selectedMoodGenre == null &&\n                tabHistory.size > 1,\n        ) {\n            val previous = tabHistory.dropLast(1)\n            tabHistory = previous\n            selectedTab = previous.last()\n        }"
          if old_back not in code:
              print("ERROR: old_back not found")
              sys.exit(1)
          code = code.replace(old_back, new_back, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: MainActivity.kt updated successfully")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/MainActivity.kt
          git diff --staged --quiet || (git commit -m "feat: implementar historico de navegacao de abas (tabHistory) no MainActivity" && git push)
