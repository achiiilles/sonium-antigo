name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update strings.xml
        run: |
          python3 - << 'EOF'
          import io

          p = "app/src/main/res/values/strings.xml"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          t = t.replace("\r\n", "\n")

          target = '    <string name="lyrics_offset_description">Positive values display lyrics later</string>\n</resources>'
          replacement = '    <string name="lyrics_offset_description">Positive values display lyrics later</string>\n    <string name="lyrics_original_title">Search lyrics with original title</string>\n    <string name="lyrics_original_title_desc">Restore original YouTube title before searching lyrics</string>\n</resources>'

          assert target in t, "target not found in strings.xml"
          t = t.replace(target, replacement, 1)

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: strings.xml patched cleanly")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/res/values/strings.xml
          git diff --staged --quiet || (git commit -m "Corrigir strings base ausentes em strings.xml" && git push origin HEAD:feat/auto-card-pill-shape)
