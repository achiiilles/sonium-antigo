name: Apply Patch
on:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update DetailScreen.kt
        run: |
          echo "" | base64 -d > patch.py
          python3 patch.py
          rm patch.py
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || git commit -m "feat: passar albuns da biblioteca para ArtistLibraryScreen em DetailScreen.kt"
          git push
