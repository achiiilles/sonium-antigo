name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fix DetailScreen.kt publicSections
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          pattern_lazy = r"Surface[\s\S]*?artist_library_pill[\s\S]*?val\s+publicSections\s*=\s*remember\(page\.sections\)\s+\{[\s\S]*?\}\s\*items\(publicSections\)"
          #

          old_public = '''            // Albums / Singles & EPs carousels (artist pages).
            val publicSections = remember(page.sections) {
                page.sections.filterNot {
                    it.title.contains("sua biblioteca", ignoreCase = true) ||
                    it.title.contains("your library", ignoreCase = true)
                }
            }'''
          if old_public in code:
              code = code.replace(old_public, "            // Albums / Singles & EPs carousels (artist pages).", 1)
              print("SUCCESS: Removed old_public")
          else:
              print("WARNING: old_public not found verbatim")

          target_top = """    val libraryArtistAlbums = remember(page.sections) {
        page.sections.filter {
            it.title.contains("sua biblioteca", ignoreCase = true) ||
            it.title.contains("your library", ignoreCase = true)
        }.flatMap { it.items }
    }"""

          addition_top = """    val publicSections = remember(page.sections) {
        page.sections.filterNot {
            it.title.contains("sua biblioteca", ignoreCase = true) ||
            it.title.contains("your library", ignoreCase = true)
        }
    }"""

          if target_top in code:
              if "val publicSections" (not in code[:code.index(target_top)]):
                  code = code.replace(target_top, f"{target_top}\n\n{addition_top}", 1)
                  print("SUCCESS: Added publicSections below libraryArtistAlbums")
          else:
              print("WARNING: target_top not found")

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("File written")
QYEOF
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || git commit -m "fix: mover publicSections para fora de LazyColumn em DetailScreen.kt"
          git push
