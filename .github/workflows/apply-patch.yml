name: Apply Patch
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair AppSettings.kt
        run: |
          cat > /tmp/fix_appsettings.py <<'PYEOF'
          import io
          import sys

          path = "app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt"
          c = io.open(path, encoding="utf-8").read()

          start = c.find('KEY_AI_LYRICS_ENABLED = "ai_lyrics_enabled"')
          end = c.find("KEY_HIDE_SONG_STATUS, true)", start) if start != -1 else -1
          if start == -1 or end == -1:
              sys.exit("mangled block not found")
          end = end + len("KEY_HIDE_SONG_STATUS, true)")
          c = c[:start] + "KEY_HIDE_SONG_STATUS, true)" + c[end:]

          good = "hideSongStatus.value = prefs.getBoolean(KEY_HIDE_SONG_STATUS, true)"
          i = c.find(good)
          if i == -1:
              sys.exit("readAll line missing after repair")
          if "aiLyricsEnabled.value = prefs.getBoolean" not in c:
              reads = ('\n        aiLyricsEnabled.value = prefs.getBoolean(KEY_AI_LYRICS_ENABLED, true)'
                       '\n        aiLyricsApiKey.value = prefs.getString(KEY_AI_LYRICS_API_KEY, "") ?: ""')
              c = c[:i + len(good)] + reads + c[i + len(good):]

          if "const val KEY_AI_LYRICS_ENABLED" not in c:
              out = []
              placed = False
              for ln in c.split("\n"):
                  s = ln.strip()
                  if (not placed) and s.startswith("const val KEY_HIDE_SONG_STATUS"):
                      ind = ln[:len(ln) - len(ln.lstrip())]
                      out.append(ind + 'private const val KEY_AI_LYRICS_ENABLED = "ai_lyrics_enabled"')
                      out.append(ind + 'private const val KEY_AI_LYRICS_API_KEY = "ai_lyrics_api_key"')
                      placed = True
                  out.append(ln)
              if not placed:
                  sys.exit("KEY_HIDE_SONG_STATUS declaration not found")
              c = "\n".join(out)

          if "getBoolean(KEY_AI_LYRICS_ENABLED = " in c:
              sys.exit("mangled text still present")
          if "const val KEY_AI_LYRICS_ENABLED" not in c or "const val KEY_AI_LYRICS_API_KEY" not in c:
              sys.exit("constants missing")

          io.open(path, "w", encoding="utf-8").write(c)
          print("AppSettings.kt repaired")
          PYEOF
          python3 /tmp/fix_appsettings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          git commit -m "fix: corrigir splice do readAll e declarar constantes aiLyrics em AppSettings.kt"
          git push
