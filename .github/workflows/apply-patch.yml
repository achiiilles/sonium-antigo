name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update MainActivity.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          import re

          path = "app/src/main/java/com/music/bitchord/MainActivity.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          code = code.replace("\r\n", "\n")

          # 1. State: tabHistory & LaunchedEffect
          target_state = "var selectedTab by rememberSaveable { mutableIntStateOf(0) }"
          replacement_state = """var selectedTab by rememberSaveable { mutableIntStateOf(0) }
    var tabHistory by rememberSaveable { mutableStateOf(listOf(0)) }

    LaunchedEffect(selectedTab) {
        if (tabHistory.lastOrNull() != selectedTab) {
            tabHistory = tabHistory + selectedTab
        }
    }"""
          if target_state not in code:
              print("ERROR: target_state not found")
              sys.exit(1)
          code = code.replace(target_state, replacement_state, 1)

          # 2. BackHandler
          old_back = """BackHandler(
            enabled = detail == null && !showSettings && !showAccountScrobbling && !showSpotify &&
                !showSources && !showListenTogether && !showEqualizer && !showReplay && selectedMoodGenre == null &&
                selectedTab != TAB_HOME,
        ) {
            selectedTab = TAB_HOME
        }"""
          new_back = """BackHandler(
            enabled = detail == null && !showSettings && !showAccountScrobbling && !showSpotify &&
                !showSources && !showListenTogether && !showEqualizer && !showReplay && selectedMoodGenre == null &&
                tabHistory.size > 1,
        ) {
            val previous = tabHistory.dropLast(1)
            tabHistory = previous
            selectedTab = previous.last()
        }"""
          if old_back in code:
              code = code.replace(old_back, new_back, 1)
          else:
              print("Trying regex for BackHandler...")
              pattern = r"(selectedMoodGenre == null &&\s+)selectedTab != TAB_HOME,(\s*\)\s*\{\s*)selectedTab = TAB_HOME(\s*\})"
              replacement = r"\1tabHistory.size > 1,\2val previous = tabHistory.dropLast(1)\n            tabHistory = previous\n            selectedTab = previous.last()\3"
              code, count = re.subn(pattern, replacement, code, count=1)
              if count == 0:
                  print("ERROR: BackHandler not found")
                  sys.exit(1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: MainActivity.kt updated successfully")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/MainActivity.kt
          git diff --staged --quiet || (git commit -m "feat: implementar historico de navegacao de abas (tabHistory) no MainActivity" && git push)
