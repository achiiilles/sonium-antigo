name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target1 = "contentPadding = contentPadding,\n    )\n}\n}\n  }\n}"
          replacement1 = "contentPadding = contentPadding,\n    )\n}\n}\n    }\n}\n}"

          if target1 not in code:
              target1 = target1.replace("\n", "\r\n")
              replacement1 = replacement1.replace("\n", "\r\n")

          if target1 not in code:
              print("ERROR: target1 not found in DetailScreen.kt")
              sys.exit(1)

          code = code.replace(target1, replacement1, 1)

          target2 = "bottom = 7.dp),\n        )\n    }\n    }\n}"
          replacement2 = "bottom = 7.dp),\n        )\n    }\n}"

          if target2 not in code:
              target2 = target2.replace("\n", "\r\n")
              replacement2 = replacement2.replace("\n", "\r\n")

          if target2 not in code:
              print("ERROR: target2 not found in DetailScreen.kt")
              sys.exit(1)

          code = code.replace(target2, replacement2, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt updated successfully")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "fix(ui): balance braces and close DetailScreen properly" && git push)
