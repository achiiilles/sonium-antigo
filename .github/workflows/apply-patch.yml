name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 - << 'EOF'
          import io, re
          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          if "import androidx.compose.material.icons.automirrored.rounded.ArrowForwardIos" not in t:
              t = t.replace(
                  "import androidx.compose.material.icons.automirrored.rounded.ArrowBack",
                  "import androidx.compose.material.icons.automirrored.rounded.ArrowBack\nimport androidx.compose.material.icons.automirrored.rounded.ArrowForwardIos"
              )

          enum_pattern = re.compile(r"enum class SettingsCategory\([\s\S]*?SYSTEM\([^\)]*\),?\s*\}", re.MULTILINE)
          new_enum = """enum class SettingsCategory(
              val title: String,
              val icon: ImageVector,
          ) {
              ACCOUNT("Conta", Icons.Rounded.Person),
              APPEARANCE("Aparência", Icons.Rounded.Brightness4),
              PLAYBACK("Reprodução", Icons.Rounded.GraphicEq),
              LYRICS("Letras", Icons.AutoMirrored.Rounded.Notes),
              REPLAY("Replay", Icons.Rounded.BarChart),
              STORAGE("Armazenamento", Icons.Rounded.Storage),
              SYSTEM("Geral", Icons.Rounded.Tune),
          }"""

          assert enum_pattern.search(t) is not None, "SettingsCategory enum not found"
          t = enum_pattern.sub(new_enum, t, count=1)

          pill_pattern = re.compile(r"SettingsPillCard\(\s*icon = category\.icon,\s*title = category\.title,\s*subtitle = category\.subtitle,[\s\S]*?\n                    \)", re.MULTILINE)
          new_pill = """SettingsPillCard(
                                  icon = category.icon,
                                  title = category.title,
                                  onClick = {
                                      internalCategory = category
                                      onSelectCategory(category)
                                  },
                                  modifier = Modifier.padding(horizontal = 20.dp, vertical = 6.dp),
                                  isStandalone = true,
                                  trailing = {
                                      Icon(
                                          imageVector = Icons.AutoMirrored.Rounded.ArrowForwardIos,
                                          contentDescription = null,
                                          tint = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.5f),
                                          modifier = Modifier.size(14.dp),
                                      )
                                  },
                              )"""

          assert pill_pattern.search(t) is not None, "SettingsPillCard call not found"
          t = pill_pattern.sub(new_pill, t, count=1)

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: SettingsSheet.kt updated cleanly")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "Remover subtítulos das categorias de configurações para layout cápsula pura" && git push)
