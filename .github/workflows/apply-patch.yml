name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Expose selectedCategory in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          old_sig = "account: Account?,\n    onSignIn: () -> Unit,"
          new_sig = "account: Account?,\n    externalCategory: SettingsCategory? = null,\n    onSelectCategory: (SettingsCategory?) -> Unit = {},\n    onSignIn: () -> Unit,"
          if old_sig not in code:
              print("ERROR: old_sig not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(old_sig, new_sig, 1)

          old_state = "var selectedCategory by rememberSaveable { mutableStateOf<SettingsCategory?>(null) }\n    BackHandler(enabled = selectedCategory != null) {\n        selectedCategory = null\n    }"
          new_state = "var internalCategory by rememberSaveable { mutableStateOf<SettingsCategory?>(null) }\n    val selectedCategory = externalCategory ?: internalCategory\n    BackHandler(enabled = selectedCategory != null) {\n        internalCategory = null\n        onSelectCategory(null)\n    }"
          if old_state not in code:
              print("ERROR: old_state not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(old_state, new_state, 1)

          old_click = "onClick = { selectedCategory = category },"
          new_click = "onClick = {\n                    internalCategory = category\n                    onSelectCategory(category)\n                },"
          if old_click not in code:
              print("ERROR: old_click not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(old_click, new_click, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: SettingsSheet.kt updated with externalCategory and onSelectCategory")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "feat: expor categoria selecionada em SettingsSheet para navegacao unificada" && git push)
