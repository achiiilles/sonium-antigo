name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Remove duplicate back button in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          btn_anchor = "IconButton(onClick = { selectedCategory = null })"
          btn_idx = code.find(btn_anchor)
          if btn_idx == -1:
              print("ERROR: btn_anchor not found in SettingsSheet.kt")
              sys.exit(1)

          row_idx = code.rfind("Row(", 0, btn_idx)
          if row_idx == -1:
              print("ERROR: row_idx not found before btn_anchor")
              sys.exit(1)

          text_idx = code.find("Text(", btn_idx)
          if text_idx == -1:
              print("ERROR: text_idx not found after btn_anchor")
              sys.exit(1)

          row_header = code[row_idx:btn_idx].replace("start = 8.dp", "start = 20.dp")
          code = code[:row_idx] + row_header + "    " + code[text_idx:]

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: Back button removed cleanly from SettingsSheet.kt")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor: remover botao de voltar da subpasta em SettingsSheet.kt" && git push)
