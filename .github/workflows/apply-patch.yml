name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update MainActivity.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "app/src/main/java/com/music/bitchord/MainActivity.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. State declaration
          old_state = "var detailActiveShelf by remember { mutableStateOf<HomeShelf?>(null) }"
          new_state = "var detailActiveShelf by remember { mutableStateOf<HomeShelf?>(null) }\n    var artistLibraryOpen by rememberSaveable { mutableStateOf(false) }"
          if old_state not in code:
              print("ERROR: old_state not found")
              sys.exit(1)
          code = code.replace(old_state, new_state, 1)

          # 2. Reset on detail change
          old_reset = "LaunchedEffect(detail?.browseId) { detailActiveShelf = null }"
          new_reset = "LaunchedEffect(detail?.browseId) { detailActiveShelf = null; artistLibraryOpen = false }"
          if old_reset not in code:
              print("ERROR: old_reset not found")
              sys.exit(1)
          code = code.replace(old_reset, new_reset, 1)

          # 3. BackHandler
          old_bh = "BackHandler(enabled = detailActiveShelf != null) { detailActiveShelf = null }"
          new_bh = "BackHandler(enabled = detail != null && artistLibraryOpen) { artistLibraryOpen = false }\n        BackHandler(enabled = detailActiveShelf != null) { detailActiveShelf = null }"
          if old_bh not in code:
              print("ERROR: old_bh not found")
              sys.exit(1)
          code = code.replace(old_bh, new_bh, 1)

          # 4. FrostedTopBar title
          old_title = "detail != null && detailActiveShelf != null -> detailActiveShelf?.title.orEmpty()"
          new_title = 'detail != null && artistLibraryOpen -> "Na sua biblioteca"\n                        detail != null && detailActiveShelf != null -> detailActiveShelf?.title.orEmpty()'
          if old_title not in code:
              print("ERROR: old_title not found")
              sys.exit(1)
          code = code.replace(old_title, new_title, 1)

          # 5. FrostedTopBar onBack
          old_back = "detailActiveShelf != null -> ({ detailActiveShelf = null })"
          new_back = "detail != null && artistLibraryOpen -> ({ artistLibraryOpen = false })\n                        detailActiveShelf != null -> ({ detailActiveShelf = null })"
          if old_back not in code:
              print("ERROR: old_back not found")
              sys.exit(1)
          code = code.replace(old_back, new_back, 1)

          # 6. FrostedTopBar trailingTitle
          old_trailing = "trailingTitle = if (detail != null && detailActiveShelf != null) detail.title else null,"
          new_trailing = "trailingTitle = if (detail != null && (detailActiveShelf != null || artistLibraryOpen)) detail.title else null,"
          if old_trailing in code:
              code = code.replace(old_trailing, new_trailing, 1)

          # 7. FrostedTopBar scrolled
          old_scrolled = "(detail != null && detailActiveShelf != null) ||"
          new_scrolled = "(detail != null && detailActiveShelf != null) ||\n                            (detail != null && artistLibraryOpen) ||"
          if old_scrolled in code:
              code = code.replace(old_scrolled, new_scrolled, 1)

          # 8. DetailScreen call
          old_detail = "DetailScreen(\n                            page = page,\n                            currentSong = player.song,\n                            isPlaying = player.isPlaying,\n                            listState = pageDetailListState,\n                            activeShelf = detailActiveShelf,\n                            onActiveShelfChange = { detailActiveShelf = it },"
          new_detail = "DetailScreen(\n                            page = page,\n                            artistLibraryOpen = artistLibraryOpen,\n                            onArtistLibraryOpenChange = { artistLibraryOpen = it },\n                            currentSong = player.song,\n                            isPlaying = player.isPlaying,\n                            listState = pageDetailListState,\n                            activeShelf = detailActiveShelf,\n                            onActiveShelfChange = { detailActiveShelf = it },"
          if old_detail in code:
              code = code.replace(old_detail, new_detail, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: MainActivity.kt updated for artist library navigation")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/MainActivity.kt
          git diff --staged --quiet || (git commit -m "feat: conectar navegacao de volta da biblioteca do artista no MainActivity" && git push)
