name: Apply Patch
on:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fix DetailScreen.kt publicSections
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          pattern_lazy = r'([ \t]*val\s+publicSections\s*=\s*remember\(page\.sections\)\s*\{[\s\S]*?it\.title\.contains\("your library"[^\n]*\n[ \t]*\}\s*\n)'
          match_lazy = re.search(pattern_lazy, code)
          if match_lazy:
              code = code[:match_lazy.start()] + code[match_lazy.end():]
              print("SUCCESS: Removed publicSections from LazyColumn")
          else:
              print("ERROR: pattern_lazy not found")
              sys.exit(1)

          target_top = """    val libraryArtistAlbums = remember(page.sections) {
        page.sections.filter {
            it.title.contains("sua biblioteca", ignoreCase = true) ||
            it.title.contains("your library", ignoreCase = true)
        }.flatMap { it.items }
    }"""

          addition_top = """    val publicSections = remember(page.sections) {
        page.sections.filterNot {
            it.title.contains("sua biblioteca", ignoreCase = true) ||
            it.title.contains("your library", ignoreCase = true)
        }
    }"""

          if target_top in code:
              code = code.replace(target_top, f"{target_top}\n\n{addition_top}", 1)
              print("SUCCESS: Added publicSections below libraryArtistAlbums")
          else:
              print("ERROR: target_top not found")
              sys.exit(1)

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("File written successfully")
PYEOF
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || git commit -m "fix: mover publicSections para fora de LazyColumn em DetailScreen.kt"
          git push
