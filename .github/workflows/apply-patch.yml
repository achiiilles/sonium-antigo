name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          pat = r'val parts = song\.artist\.split\(ARTIST_SPLIT_REGEX\)\.map\s*\{\s*it\.trim\(\)\s*\}\s*\r?\n\s*return parts\.any\s*\{\s*it\.equals\(cleanArtistName,\s*ignoreCase\s*=\s*true\)\s*\}'
          m = re.search(pat, code)
          if not m:
              print("ERROR: target snippet not found in DetailScreen.kt")
              sys.exit(1)

          replacement = """val parts = song.artist.split(ARTIST_SPLIT_REGEX).map { it.trim() }
              if (parts.any { it.equals(cleanArtistName, ignoreCase = true) }) return true

              val titleLower = song.title.lowercase()
              val nameLower = cleanArtistName.lowercase()
              return titleLower.contains("feat. $nameLower") ||
                     titleLower.contains("ft. $nameLower") ||
                     titleLower.contains("with $nameLower") ||
                     titleLower.contains("featuring $nameLower") ||
                     titleLower.contains("e $nameLower") ||
                     titleLower.contains("& $nameLower")"""

          code = code[:m.start()] + replacement + code[m.end():]

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt updated successfully with title feat detection")
          PYEOF

      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "feat: detectar feats e colaboracoes no titulo em DetailScreen.kt" && git push)
