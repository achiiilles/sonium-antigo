name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          albums_pat = r'(val\s+libraryArtistAlbums\s*=\s*remember\(page\.sections\)\s*\{[\s\S]*?\}\.flatMap\s*\{\s*it\.items\s*\}\s*\n\s*\})'
          m = re.search(albums_pat, code)
          if not m:
              print("ERROR: libraryArtistAlbums pattern not found")
              sys.exit(1)

          public_sections_code = (
              "\n\n"
              "    val publicSections = remember(page.sections) {\n"
              "        page.sections.filterNot {\n"
              "            it.title.contains(\"sua biblioteca\", ignoreCase = true) ||\n"
              "            it.title.contains(\"your library\", ignoreCase = true)\n"
              "        }\n"
              "    }"
          )

          if "val publicSections" not in code[m.start():m.end() + 250]:
              code = code[:m.end()] + public_sections_code + code[m.end():]
              print("SUCCESS: Added publicSections after libraryArtistAlbums")
          else:
              print("INFO: publicSections already present after libraryArtistAlbums")

          lazy_pat = r'(// Albums / Singles & EPs carousels \(artist pages\)\.\s*\n)\s*val\s+publicSections\s*=\s*remember\(page\.sections\)\s*\{[\s\S]*?\}\s*\n(\s*items\(publicSections\)\s*\{\s*shelf\s*->)'
          if re.search(lazy_pat, code):
              code = re.sub(lazy_pat, r'\1\2', code, count=1)
              print("SUCCESS: Removed publicSections inside LazyColumn")
          else:
              print("ERROR: lazy_pat pattern not found")
              sys.exit(1)

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt patched successfully")
          PYEOF

      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "fix: mover publicSections para fora de LazyColumn em DetailScreen.kt" && git push)
