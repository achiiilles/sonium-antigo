name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Patch Script
        run: |
          python3 -c '
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          imp_target = "import androidx.compose.material.icons.rounded.LibraryMusic\n"
          imp_replacement = "import androidx.compose.material.icons.rounded.LibraryMusic\nimport androidx.compose.material.icons.automirrored.rounded.KeyboardArrowRight\nimport androidx.compose.material3.Surface\nimport androidx.compose.foundation.BorderStroke\n"

          if imp_target in content and imp_replacement not in content:
              content = content.replace(imp_target, imp_replacement, 1)

          marker = "// Albums / Singles & EPs carousels (artist pages)."
          if marker not in content:
              raise ValueError("Marker not found in DetailScreen.kt")

          pill_block = """            if (isArtist) {
                  item(key = "artist_library_pill") {
                      Surface(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = PAGE_GUTTER, vertical = 6.dp)
                              .clickable { /* abrir tela dedicada da biblioteca */ },
                          shape = CircleShape,
                          color = palette.elevated,
                          border = BorderStroke(0.5.dp, Color.White.copy(alpha = 0.12f)),
                      ) {
                          Row(
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Icon(
                                  imageVector = Icons.Rounded.LibraryMusic,
                                  contentDescription = null,
                                  tint = palette.onBackground,
                                  modifier = Modifier.size(18.dp),
                              )
                              Spacer(Modifier.width(8.dp))
                              Text(
                                  text = "Na sua biblioteca",
                                  style = MaterialTheme.typography.labelLarge,
                                  color = palette.onBackground,
                              )
                              Spacer(Modifier.weight(1f))
                              Icon(
                                  imageVector = Icons.AutoMirrored.Rounded.KeyboardArrowRight,
                                  contentDescription = null,
                                  tint = palette.onBackgroundVariant,
                                  modifier = Modifier.size(18.dp),
                              )
                          }
                      }
                  }
              }

  """

          lines = content.splitlines(keepends=True)
          new_lines = []
          inserted = False
          for line in lines:
              if not inserted and marker in line:
                  new_lines.append(pill_block)
                  inserted = True
              new_lines.append(line)

          if not inserted:
              raise ValueError("Could not insert pill block before marker")

          content = "".join(new_lines)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git commit -m "feat: adicionar pilula Na sua biblioteca no DetailScreen.kt"
          git push
