name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c 'import io, sys; p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"; f = io.open(p, "r", encoding="utf-8"); t = f.read(); f.close(); target_misc = "SearchableSettingsGroup(search, header = stringResource(R.string.miscellaneous)) {"; i_misc = t.find(target_misc); assert i_misc != -1, "misc group not found"; i_comm = t.find("// No footer: it only restated the stop-on-close"); s_rem = t.rfind("\n", 0, i_comm) + 1 if i_comm != -1 else t.rfind("\n", 0, i_misc) + 1; i_swipe = t.find("val playNextOnSwipeTitle = stringResource(R.string.play_next_on_swipe)", i_misc); assert i_swipe != -1, "swipe not found"; i_stop = t.find("AppSettings.setStopOnTaskRemoved(!stopOnTaskRemoved)", i_swipe); assert i_stop != -1, "stop not found"; e_stop = t.find("}", t.find(")", i_stop)) + 1; e_stop_row = t.find("}", e_stop) + 1; e_stop_row = e_stop_row + 1 if (e_stop_row < len(t) and t[e_stop_row] == "\n") else e_stop_row; block = t[i_swipe:e_stop_row]; e_misc = t.find("}", e_stop_row) + 1; e_misc = e_misc + 1 if (e_misc < len(t) and t[e_misc] == "\n") else e_misc; t = t[:s_rem] + t[e_misc:]; i_eq = t.find("val equalizerTitle = stringResource(R.string.equalizer)"); assert i_eq != -1, "eq not found"; i_eq_click = t.find("onClick = onEqualizer", i_eq); assert i_eq_click != -1, "eq click not found"; e_eq_row = t.find("}", t.find(")", i_eq_click)) + 1; e_eq_row = e_eq_row + 1 if (e_eq_row < len(t) and t[e_eq_row] == "\n") else e_eq_row; t = t[:e_eq_row] + block + t[e_eq_row:]; f = io.open(p, "w", encoding="utf-8"); f.write(t); f.close(); print("SUCCESS: SettingsSheet.kt updated")'
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor(settings): move playback options from miscellaneous to playback category" && git push)
