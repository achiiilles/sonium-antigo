name: Apply Patch
on:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fix DetailScreen.kt publicSections
        run: |
          python3 - << 'PYEOF'
          import io, re, sys

          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          pattern_lazy = r"[ \t]*val\s+publicSections\s*=\s*remember\(page\.sections\)\s+\{[\s\S]*?it\.title\.contains\("your library"[^\n]*\n[ \t]*\}\s*\n"
          if re.search(pattern_lazy, code):
              code = re.sub(pattern_lazy, "", code, count=1)
              print("Removed publicSections from LazyColumn")
          else:
              print("Warning: pattern_lazy not found")

          if "val publicSections" not in code:
              pattern_top = r"(val\s+libraryArtistAlbums\s*=\s*remember\(page\.sections\)\s*\{[\s\S]*?flatMap\s*\{\s*it\.items\s*\}\s*\})"
              replacement = r"""\1


    val publicSections = remember(page.sections) {
        page.sections.filterNot {
            it.title.contains("sua biblioteca", ignoreCase = true) ||
            it.title.contains("your library", ignoreCase = true)
        }
    }"""
              code = re.sub(pattern_top, replacement, code, count=1)
              print("Added publicSections at top level")

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          PYEOF
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || git commit -m "fix: mover publicSections para fora de LazyColumn em DetailScreen.kt"
          git push