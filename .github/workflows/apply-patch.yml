name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update DetailScreen.kt
        run: |
          python3 - << 'PYEOF'
          import sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. Parameter list
          old_param = "    onActiveShelfChange: (HomeShelf?) -> Unit = {},"
          new_param = "    onActiveShelfChange: (HomeShelf?) -> Unit = {},\n    artistLibraryOpen: Boolean = false,\n    onArtistLibraryOpenChange: (Boolean) -> Unit = {},"
          if old_param not in code:
              print("ERROR: old_param not found")
              sys.exit(1)
          code = code.replace(old_param, new_param, 1)

          # 2. State & BackHandler
          old_state = "    var focusSearch by remember(page.browseId) { mutableStateOf(false) }\n    var showArtistLibrary by rememberSaveable(page.browseId) { mutableStateOf(false) }\n    BackHandler(enabled = showArtistLibrary) { showArtistLibrary = false }"
          new_state = "    var focusSearch by remember(page.browseId) { mutableStateOf(false) }\n    BackHandler(enabled = artistLibraryOpen) { onArtistLibraryOpenChange(false) }"
          if old_state not in code:
              print("ERROR: old_state not found")
              sys.exit(1)
          code = code.replace(old_state, new_state, 1)

          # 3. AnimatedContent & ArtistLibraryScreen
          old_anim = "        AnimatedContent(\n        targetState = showArtistLibrary,"
          new_anim = "        AnimatedContent(\n        targetState = artistLibraryOpen,"
          if old_anim not in code:
              print("ERROR: old_anim not found")
              sys.exit(1)
          code = code.replace(old_anim, new_anim, 1)

          old_back = "                onBack = { showArtistLibrary = false },"
          new_back = "                onBack = { onArtistLibraryOpenChange(false) },"
          if old_back not in code:
              print("ERROR: old_back not found")
              sys.exit(1)
          code = code.replace(old_back, new_back, 1)

          # 4. Pill clickable
          old_click = "                    .clickable { showArtistLibrary = true },"
          new_click = "                    .clickable { onArtistLibraryOpenChange(true) },"
          if old_click not in code:
              print("ERROR: old_click not found")
              sys.exit(1)
          code = code.replace(old_click, new_click, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: DetailScreen.kt updated successfully")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git diff --staged --quiet || (git commit -m "feat: conectar navegacao de volta da biblioteca do artista no DetailScreen" && git push)
