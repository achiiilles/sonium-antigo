name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c 'import io
          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          replacements = [
              ("Conta & Conexões", "Conta"),
              ("Aparência & Interface", "Aparência"),
              ("Reprodução & Áudio", "Reprodução"),
              ("Biblioteca & Armazenamento", "Armazenamento"),
              ("Geral & Sistema", "Geral")
          ]

          for old, new in replacements:
              cnt = t.count(old)
              assert cnt >= 2, f"Expected at least 2 occurrences of {old}, found {cnt}"
              t = t.replace(old, new)

          assert "ACCOUNT(\"Conta\"," in t
          assert "APPEARANCE(\"Aparência\"," in t
          assert "PLAYBACK(\"Reprodução\"," in t
          assert "STORAGE(\"Armazenamento\"," in t
          assert "SYSTEM(\"Geral\"," in t

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: SettingsSheet.kt updated cleanly")
          '
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "Refatorar títulos das categorias de configurações para padrão iOS limpo" && git push)
