name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Reorder SettingsCategory in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          old_part = (
              '    ACCOUNT("Conta & Conexões", "YouTube Music, Scrobbling e Sessão Conjunta", Icons.Rounded.Person),\n'
              '    PLAYBACK("Reprodução & Áudio", "Qualidade sonora, equalizador, áudio espacial e volume", Icons.Rounded.GraphicEq),\n'
              '    LYRICS("Letras", "Sincronização, fontes, desfoque e tradução por IA", Icons.AutoMirrored.Rounded.Notes),\n'
              '    APPEARANCE("Aparência & Interface", "Tema, capas animadas, vidro líquido e animações", Icons.Rounded.Brightness4),\n'
              '    STORAGE("Biblioteca & Armazenamento", "Downloads, cache de faixas, música local e backup", Icons.Rounded.Storage),\n'
              '    SYSTEM("Geral & Sistema", "Taxa de atualização, idioma do app e estatísticas", Icons.Rounded.Tune),'
          )

          new_part = (
              '    ACCOUNT("Conta & Conexões", "YouTube Music, Scrobbling e Sessão Conjunta", Icons.Rounded.Person),\n'
              '    APPEARANCE("Aparência & Interface", "Tema, capas animadas, vidro líquido e animações", Icons.Rounded.Brightness4),\n'
              '    PLAYBACK("Reprodução & Áudio", "Qualidade sonora, equalizador, áudio espacial e volume", Icons.Rounded.GraphicEq),\n'
              '    LYRICS("Letras", "Sincronização, fontes, desfoque e tradução por IA", Icons.AutoMirrored.Rounded.Notes),\n'
              '    STORAGE("Biblioteca & Armazenamento", "Downloads, cache de faixas, música local e backup", Icons.Rounded.Storage),\n'
              '    SYSTEM("Geral & Sistema", "Taxa de atualização, idioma do app e estatísticas", Icons.Rounded.Tune),'
          )

          target = None
          replacement = None
          if old_part in code:
              target = old_part
              replacement = new_part
          elif old_part.replace('\n', '\r\n') in code:
              target = old_part.replace('\n', '\r\n')
              replacement = new_part.replace('\n', '\r\n')

          if target:
              code = code.replace(target, replacement, 1)
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("SUCCESS: SettingsCategory reordered successfully")
          else:
              print("ERROR: old_part not found in SettingsSheet.kt")
              sys.exit(1)
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor: reordenar categorias de configuracoes colocando Aparencia em segundo" && git push)
