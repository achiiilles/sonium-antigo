name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 - << 'EOF'
          import io

          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          t = t.replace("\r\n", "\n")

          old_text = (
              "                )\n"
              "            },\n"
              "                    modifier = Modifier.padding(horizontal = 20.dp, vertical = 6.dp),\n"
              "                )\n"
              "            }"
          )
          new_text = (
              "                )\n"
              "            }"
          )

          assert old_text in t, "duplicate block not found"
          t = t.replace(old_text, new_text)

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: SettingsSheet.kt cleaned up perfectly")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "Remover subtítulos das categorias de configurações para layout cápsula pura" && git push)
