name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c 'import io, sys; p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"; f = io.open(p, "r", encoding="utf-8"); t = f.read(); f.close(); i_vol = t.find("val hideVolumeBarTitle = stringResource(R.string.hide_volume_bar)"); assert i_vol != -1, "vol not found"; s_rem = t.rfind("\n", 0, i_vol) + 1; i_st = t.find("AppSettings.setHideSongStatus(hideSongStatus)", i_vol); assert i_st != -1, "status not found"; e_row = t.find("}", t.find(")", i_st)); e_rem = t.find("}", e_row + 1) + 1; e_rem = e_rem + 1 if (e_rem < len(t) and t[e_rem] == "\n") else e_rem; block = t[s_rem:e_rem]; t = t[:s_rem] + t[e_rem:]; i_mesh = t.find("AppSettings.setLegacyMeshGradient(!legacyMeshGradient)"); assert i_mesh != -1, "mesh not found"; e_m_row = t.find("}", t.find(")", i_mesh)); e_m_block = t.find("}", e_m_row + 1) + 1; e_m_block = e_m_block + 1 if (e_m_block < len(t) and t[e_m_block] == "\n") else e_m_block; t = t[:e_m_block] + block + t[e_m_block:]; f = io.open(p, "w", encoding="utf-8"); f.write(t); f.close(); print("SUCCESS: SettingsSheet.kt updated")'
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "refactor(settings): move volume bar and song status options to appearance category" && git push)
