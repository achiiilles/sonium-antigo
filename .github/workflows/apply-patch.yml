name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 - << 'EOF'
          import io

          p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          t = t.replace("\r\n", "\n")

          # 1. Update SearchableSettingsGroup to have shape: Shape? = null and resolve dynamically
          old_searchable = "\n".join([
              "@Composable",
              "private fun SearchableSettingsGroup(",
              "    search: SettingsSearch,",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape = GroupShape,",
              "    content: @Composable SettingsGroupScope.() -> Unit,",
              ") {",
              "    val scope = SettingsGroupScope(search, header)",
              "    scope.content()",
              "    if (scope.entries.isEmpty()) return",
              "    SettingsGroup(header = header, footer = footer, topSpacing = topSpacing, shape = shape) {",
          ])

          new_searchable = "\n".join([
              "@Composable",
              "private fun SearchableSettingsGroup(",
              "    search: SettingsSearch,",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape? = null,",
              "    content: @Composable SettingsGroupScope.() -> Unit,",
              ") {",
              "    val scope = SettingsGroupScope(search, header)",
              "    scope.content()",
              "    if (scope.entries.isEmpty()) return",
              "    val resolvedShape = shape ?: if (scope.entries.size == 1) CapsuleShape else GroupShape",
              "    SettingsGroup(header = header, footer = footer, topSpacing = topSpacing, shape = resolvedShape) {",
          ])

          assert old_searchable in t, "old_searchable not found in SettingsSheet.kt"
          t = t.replace(old_searchable, new_searchable, 1)

          # 2. Update SettingsGroup to add itemCount: Int? = null and compute effectiveShape
          old_group = "\n".join([
              "@Composable",
              "internal fun SettingsGroup(",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    /** Room above the card, where there is no [header] to provide it. */",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape = GroupShape,",
              "    content: @Composable () -> Unit,",
              ") {",
              "    val isCapsule = shape == CapsuleShape",
              "    val animatedCornerRadius by animateDpAsState(",
              "        targetValue = if (isCapsule) 28.dp else 14.dp,",
              "        animationSpec = spring(",
              "            dampingRatio = Spring.DampingRatioLowBouncy,",
              "            stiffness = Spring.StiffnessMedium,",
              "        ),",
              "        label = \"cardShapeAnimation\",",
              "    )",
              "    val currentShape = if (shape == CapsuleShape || shape == GroupShape) {",
              "        RoundedCornerShape(animatedCornerRadius)",
              "    } else {",
              "        shape",
              "    }",
          ])

          new_group = "\n".join([
              "@Composable",
              "internal fun SettingsGroup(",
              "    header: String? = null,",
              "    footer: String? = null,",
              "    /** Room above the card, where there is no [header] to provide it. */",
              "    topSpacing: Dp = 26.dp,",
              "    shape: Shape = GroupShape,",
              "    itemCount: Int? = null,",
              "    content: @Composable () -> Unit,",
              ") {",
              "    val effectiveShape = when {",
              "        itemCount != null -> if (itemCount == 1) CapsuleShape else GroupShape",
              "        else -> shape",
              "    }",
              "    val isCapsule = effectiveShape == CapsuleShape",
              "    val animatedCornerRadius by animateDpAsState(",
              "        targetValue = if (isCapsule) 28.dp else 14.dp,",
              "        animationSpec = spring(",
              "            dampingRatio = Spring.DampingRatioLowBouncy,",
              "            stiffness = Spring.StiffnessMedium,",
              "        ),",
              "        label = \"cardShapeAnimation\",",
              "    )",
              "    val currentShape = if (effectiveShape == CapsuleShape || effectiveShape == GroupShape) {",
              "        RoundedCornerShape(animatedCornerRadius)",
              "    } else {",
              "        effectiveShape",
              "    }",
          ])

          if old_group not in t:
              old_group_alt = old_group.replace("/** Room", "/* Room")
              if old_group_alt in t:
                  old_group = old_group_alt

          assert old_group in t, "old_group not found in SettingsSheet.kt"
          t = t.replace(old_group, new_group, 1)

          # 3. In APPEARANCE: remove explicit shape = CapsuleShape from Tema
          old_theme = "\n".join([
              "    // 1. Tema (sozinho -> pílula, sem cabeçalho)",
              "    SearchableSettingsGroup(",
              "        search,",
              "        header = null,",
              "        topSpacing = 8.dp,",
              "        shape = CapsuleShape,",
              "    ) {",
          ])

          new_theme = "\n".join([
              "    // 1. Tema (sozinho -> pílula, sem cabeçalho)",
              "    SearchableSettingsGroup(",
              "        search,",
              "        header = null,",
              "        topSpacing = 8.dp,",
              "    ) {",
          ])

          assert old_theme in t, "old_theme not found in SettingsSheet.kt"
          t = t.replace(old_theme, new_theme, 1)

          # 4. In APPEARANCE: remove explicit shape = if (animatedCanvas) GroupShape else CapsuleShape from Capa Animada
          old_canvas = "\n".join([
              "    // 4. Capa Animada (sozinha é pílula; com sub-opções ativas é grupo)",
              "    SearchableSettingsGroup(",
              "        search,",
              "        header = \"Capa Animada\",",
              "        shape = if (animatedCanvas) GroupShape else CapsuleShape,",
              "    ) {",
          ])

          new_canvas = "\n".join([
              "    // 4. Capa Animada (sozinha é pílula; com sub-opções ativas é grupo)",
              "    SearchableSettingsGroup(",
              "        search,",
              "        header = \"Capa Animada\",",
              "    ) {",
          ])

          assert old_canvas in t, "old_canvas not found in SettingsSheet.kt"
          t = t.replace(old_canvas, new_canvas, 1)

          open_b = t.count('{')
          close_b = t.count('}')
          assert open_b == close_b, f"Unbalanced braces: {open_b} vs {close_b}"

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: SettingsSheet.kt patched cleanly for Step 1")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "Passo 1: Automatizar cálculo de shape dos cards no SettingsSheet" && git push origin HEAD:feat/auto-card-pill-shape)
