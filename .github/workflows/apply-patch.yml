name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Expose selectedCategory in SettingsSheet.kt
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          with io.open(path, "r", encoding="utf-8") as f:
              code = f.read()

          target1 = """fun SettingsScreen(
    /** The window's width, for the gates that depend on it. */
    windowWidth: Dp,
    signedIn: Boolean,
    account: Account?,"""
          replace1 = """fun SettingsScreen(
    /** The window's width, for the gates that depend on it. */
    windowWidth: Dp,
    signedIn: Boolean,
    account: Account?,
    externalCategory: SettingsCategory? = null,
    onSelectCategory: (SettingsCategory?) -> Unit = {},"""

          if target1 not in code:
              print("ERROR: target1 not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(target1, replace1, 1)

          target2 = """var selectedCategory by rememberSaveable { mutableStateOf<SettingsCategory?>(null) }
    BackHandler(enabled = selectedCategory != null) {
        selectedCategory = null
    }"""
          replace2 = """var internalCategory by rememberSaveable { mutableStateOf<SettingsCategory?>(null) }
    val selectedCategory = externalCategory ?: internalCategory
    BackHandler(enabled = selectedCategory != null) {
        internalCategory = null
        onSelectCategory(null)
    }"""

          if target2 not in code:
              print("ERROR: target2 not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(target2, replace2, 1)

          target3 = "onClick = { selectedCategory = category },"
          replace3 = """onClick = {
                        internalCategory = category
                        onSelectCategory(category)
                    },"""

          if target3 not in code:
              print("ERROR: target3 not found in SettingsSheet.kt")
              sys.exit(1)
          code = code.replace(target3, replace3, 1)

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: SettingsSheet.kt updated with externalCategory and onSelectCategory")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "feat: expor categoria selecionada em SettingsSheet para navegacao unificada" && git push)
