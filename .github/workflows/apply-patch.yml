name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update AccountAndScrobblingScreen.kt
        run: |
          python3 - << 'EOF'
          import io

          p = "app/src/main/java/com/music/bitchord/ui/screens/AccountAndScrobblingScreen.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          t = t.replace("\r\n", "\n")

          # 1. Import CapsuleShape
          if "import com.music.bitchord.ui.theme.CapsuleShape" not in t:
              assert "package com.music.bitchord.ui.screens\n" in t, "package declaration not found"
              t = t.replace(
                  "package com.music.bitchord.ui.screens\n",
                  "package com.music.bitchord.ui.screens\n\nimport com.music.bitchord.ui.theme.CapsuleShape\n"
              )

          # 2. Spotify card
          old_spotify = (
              "        SettingsGroup(\n"
              "            header = stringResource(R.string.spotify),\n"
              "            footer = stringResource(R.string.spotify_connect_subtitle),\n"
              "        ) {"
          )
          new_spotify = (
              "        SettingsGroup(\n"
              "            header = stringResource(R.string.spotify),\n"
              "            footer = stringResource(R.string.spotify_connect_subtitle),\n"
              "            shape = if (spotifyConnected.isNotBlank()) GroupShape else CapsuleShape,\n"
              "        ) {"
          )
          assert old_spotify in t, "old_spotify not found"
          t = t.replace(old_spotify, new_spotify)

          # 3. Discord card
          old_discord = (
              "        SettingsGroup(\n"
              "            header = stringResource(R.string.rich_presence),\n"
              "            footer = stringResource(R.string.rich_presence_footer),\n"
              "        ) {"
          )
          new_discord = (
              "        SettingsGroup(\n"
              "            header = stringResource(R.string.rich_presence),\n"
              "            footer = stringResource(R.string.rich_presence_footer),\n"
              "            shape = CapsuleShape,\n"
              "        ) {"
          )
          assert old_discord in t, "old_discord not found"
          t = t.replace(old_discord, new_discord)

          open_b = t.count('{')
          close_b = t.count('}')
          assert open_b == close_b, f"Unbalanced braces: {open_b} vs {close_b}"

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: AccountAndScrobblingScreen.kt patched cleanly")
          EOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/AccountAndScrobblingScreen.kt
          git diff --staged --quiet || (git commit -m "Deixar cards isolados de Spotify e Discord em formato CapsuleShape" && git push)
