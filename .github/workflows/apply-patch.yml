name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update Theme.kt
        run: |
          python3 -c 'import io
          p = "app/src/main/java/com/music/bitchord/ui/theme/Theme.kt"
          with io.open(p, "r", encoding="utf-8") as f:
              t = f.read()

          assert "subtitle: String," in t, "subtitle: String, not found"
          t = t.replace("subtitle: String,", "subtitle: String? = null,", 1)

          old_sub = "            Spacer(Modifier.height(1.dp))\n            Text(\n                text = subtitle,\n                style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )"
          new_sub = "            if (!subtitle.isNullOrBlank()) {\n                Spacer(Modifier.height(1.dp))\n                Text(\n                    text = subtitle,\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis,\n                )\n            }"

          assert old_sub in t, "old_sub not found in Theme.kt"
          t = t.replace(old_sub, new_sub, 1)

          with io.open(p, "w", encoding="utf-8") as f:
              f.write(t)
          print("SUCCESS: Theme.kt updated cleanly")
          '
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/theme/Theme.kt
          git diff --staged --quiet || (git commit -m "Tornar subtitle opcional em SettingsPillCard" && git push)
