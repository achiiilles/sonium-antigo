name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Patch Script
        run: |
          python3 .github/scripts/patch_detail.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/ui/screens/DetailScreen.kt
          git commit -m "feat: cards circulares para artistas recomendados em DetailScreen.kt"
          git push
