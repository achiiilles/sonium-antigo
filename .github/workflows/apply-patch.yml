name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update SettingsSheet.kt
        run: |
          python3 -c 'import io, sys; p = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"; f = io.open(p, "r", encoding="utf-8"); t = f.read(); f.close(); target = "LYRICS(\"Letras\", \"Sincronização, fontes, desfoque e tradução por IA\", Icons.AutoMirrored.Rounded.Notes),"; idx = t.find(target); assert idx != -1, "LYRICS target not found"; line_start = t.rfind("\n", 0, idx); indent = t[line_start + 1:idx] if line_start != -1 else ""; replay_line = indent + "REPLAY(\"Replay\", \"Retrospectiva e histórico de audição\", Icons.Rounded.BarChart),"; t = t.replace(target, target + "\n" + replay_line, 1); f = io.open(p, "w", encoding="utf-8"); f.write(t); f.close(); print("SUCCESS: Added REPLAY category to SettingsCategory")'
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          git diff --staged --quiet || (git commit -m "feat(settings): add Replay category to SettingsCategory" && git push)
