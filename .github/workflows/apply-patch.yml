name: Apply Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-patch.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update MainActivity.kt for unified subpage back navigation
        run: |
          python3 - << 'PYEOF'
          import sys

          path = "app/src/main/java/com/music/bitchord/MainActivity.kt"
          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          # 1. Import SettingsCategory if not present
          if "import com.music.bitchord.ui.screens.SettingsCategory" not in code:
              if "import com.music.bitchord.ui.screens.SettingsScreen" in code:
                  code = code.replace(
                      "import com.music.bitchord.ui.screens.SettingsScreen",
                      "import com.music.bitchord.ui.screens.SettingsCategory\nimport com.music.bitchord.ui.screens.SettingsScreen",
                      1
                  )

          # 2. State declaration
          old_state = "var showSettings by rememberSaveable { mutableStateOf(false) }"
          new_state = "var showSettings by rememberSaveable { mutableStateOf(false) }\n    var settingsCategory by rememberSaveable { mutableStateOf<SettingsCategory?>(null) }"
          if old_state not in code:
              print("ERROR: old_state not found in MainActivity.kt")
              sys.exit(1)
          code = code.replace(old_state, new_state, 1)

          # 3. FrostedTopBar title
          old_title = "showSettings -> stringResource(R.string.settings)"
          new_title = "showSettings && settingsCategory != null -> settingsCategory!!.title\n                        showSettings -> stringResource(R.string.settings)"
          if old_title not in code:
              print("ERROR: old_title not found in MainActivity.kt")
              sys.exit(1)
          code = code.replace(old_title, new_title, 1)

          # 4. FrostedTopBar onBack
          old_back = """                        settingsSubScreen != null -> ({ settingsSubScreen = null })
                        showSettings -> ({ showSettings = false })"""
          new_back = """                        settingsSubScreen != null -> ({ settingsSubScreen = null })
                        showSettings && settingsCategory != null -> ({ settingsCategory = null })
                        showSettings -> ({ showSettings = false })"""
          if old_back in code:
              code = code.replace(old_back, new_back, 1)
          elif "showSettings -> ({ showSettings = false })" in code:
              code = code.replace(
                  "showSettings -> ({ showSettings = false })",
                  "showSettings && settingsCategory != null -> ({ settingsCategory = null })\n                        showSettings -> ({ showSettings = false })",
                  1
              )

          # 5. BackHandler for settingsCategory
          old_bh = "BackHandler(enabled = showSettings && !showSpotify &&"
          new_bh = """BackHandler(enabled = showSettings && settingsCategory != null) {
              settingsCategory = null
          }
          BackHandler(enabled = showSettings && !showSpotify &&"""
          if old_bh not in code:
              print("ERROR: old_bh not found in MainActivity.kt")
              sys.exit(1)
          code = code.replace(old_bh, new_bh, 1)

          # 6. SettingsScreen call
          old_screen = """                        SettingsScreen(
                              windowWidth = windowWidth,
                              signedIn = signedIn,
                              account = account,
                              onSignIn = {"""
          new_screen = """                        SettingsScreen(
                              windowWidth = windowWidth,
                              signedIn = signedIn,
                              account = account,
                              externalCategory = settingsCategory,
                              onSelectCategory = { settingsCategory = it },
                              onSignIn = {"""
          if old_screen not in code:
              print("ERROR: old_screen not found in MainActivity.kt")
              sys.exit(1)
          code = code.replace(old_screen, new_screen, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          print("SUCCESS: MainActivity.kt updated for unified back navigation")
          PYEOF
      - name: Commit and push
        run: |
          git add app/src/main/java/com/music/bitchord/MainActivity.kt
          git diff --staged --quiet || (git commit -m "feat: conectar botao voltar superior as subpastas de configuracoes no MainActivity" && git push)
